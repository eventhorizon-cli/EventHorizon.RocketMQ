name: .NET Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dotnet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    name: Format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore EventHorizon.RocketMQ.slnx

      - name: Verify formatting
        run: >-
          dotnet format EventHorizon.RocketMQ.slnx
          --no-restore
          --verify-no-changes
          --verbosity diagnostic

      - name: Build
        run: >-
          dotnet build EventHorizon.RocketMQ.slnx
          --configuration Release
          --no-restore

  unit_tests:
    name: ${{ matrix.name }} unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: gRPC
            test_project: tests/ut/EventHorizon.RocketMQ.Grpc.Tests/EventHorizon.RocketMQ.Grpc.Tests.csproj
            coverage_directory: grpc
            coverage_name: dotnet-grpc-unit-tests
          - name: Remoting
            test_project: tests/ut/EventHorizon.RocketMQ.Remoting.Tests/EventHorizon.RocketMQ.Remoting.Tests.csproj
            coverage_directory: remoting
            coverage_name: dotnet-remoting-unit-tests
          - name: Compatibility
            test_project: tests/ut/EventHorizon.RocketMQ.Compatibility.Tests/EventHorizon.RocketMQ.Compatibility.Tests.csproj
            coverage_directory: compatibility
            coverage_name: dotnet-compatibility-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore unit tests
        run: >-
          dotnet restore "${{ matrix.test_project }}"

      - name: Build unit tests
        run: >-
          dotnet build "${{ matrix.test_project }}"
          --configuration Release
          --no-restore

      - name: Test unit tests
        run: >-
          dotnet test "${{ matrix.test_project }}"
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/coverage/${{ matrix.coverage_directory }}"

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ${{ runner.temp }}/coverage/${{ matrix.coverage_directory }}
          fail_ci_if_error: true
          flags: unit-tests
          name: ${{ matrix.coverage_name }}
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: ${{ matrix.protocol }} ${{ matrix.topology }} Docker integration tests and coverage
    needs: [validate, unit_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: gRPC
            topology: single-Broker
            test_project: tests/it/EventHorizon.RocketMQ.Grpc.IntegrationTests/EventHorizon.RocketMQ.Grpc.IntegrationTests.csproj
            test_filter: Topology!=MultiBroker
            coverage_directory: grpc-single-broker-integration
            coverage_name: dotnet-grpc-single-broker-integration-tests
          - protocol: gRPC
            topology: multi-Broker
            test_project: tests/it/EventHorizon.RocketMQ.Grpc.IntegrationTests/EventHorizon.RocketMQ.Grpc.IntegrationTests.csproj
            test_filter: Topology=MultiBroker
            coverage_directory: grpc-multi-broker-integration
            coverage_name: dotnet-grpc-multi-broker-integration-tests
          - protocol: Remoting
            topology: single-Broker
            test_project: tests/it/EventHorizon.RocketMQ.Remoting.IntegrationTests/EventHorizon.RocketMQ.Remoting.IntegrationTests.csproj
            test_filter: Topology!=MultiBroker
            coverage_directory: remoting-single-broker-integration
            coverage_name: dotnet-remoting-single-broker-integration-tests
          - protocol: Remoting
            topology: multi-Broker
            test_project: tests/it/EventHorizon.RocketMQ.Remoting.IntegrationTests/EventHorizon.RocketMQ.Remoting.IntegrationTests.csproj
            test_filter: Topology=MultiBroker
            coverage_directory: remoting-multi-broker-integration
            coverage_name: dotnet-remoting-multi-broker-integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: >-
          dotnet restore "${{ matrix.test_project }}"

      - name: Build integration tests
        run: >-
          dotnet build "${{ matrix.test_project }}"
          --configuration Release
          --no-restore

      - name: Test integration
        run: >-
          dotnet test "${{ matrix.test_project }}"
          --configuration Release
          --no-build
          --no-restore
          --filter "${{ matrix.test_filter }}"
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/coverage/${{ matrix.coverage_directory }}"

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ${{ runner.temp }}/coverage
          fail_ci_if_error: true
          flags: integration-tests
          name: ${{ matrix.coverage_name }}
          token: ${{ secrets.CODECOV_TOKEN }}
