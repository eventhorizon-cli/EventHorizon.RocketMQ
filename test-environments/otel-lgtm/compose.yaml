name: rocketmq-dotnet-otel-lgtm

services:
  lgtm:
    image: grafana/otel-lgtm:0.29.0
    init: true
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - lgtm-data:/data
      - ./grafana/provisioning/datasources/rocketmq-otel.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/rocketmq-otel.yaml:ro
      - ./grafana/provisioning/dashboards/rocketmq-otel.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/rocketmq-otel.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/rocketmq:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    stop_grace_period: 15s

volumes:
  lgtm-data:
